apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-webflux-deployment
  namespace: practica-s10
  labels:
    app: backend-webflux
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-webflux
      tier: backend
  template:
    metadata:
      labels:
        app: backend-webflux
        tier: backend
    spec:
      containers:
        - name: spring-webflux-api
          image: vallegrande/webflux-mongo-k8s:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http-netty
          envFrom:
            - configMapRef:
                name: app-configmap
            - secretRef:
                name: db-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend-webflux-service
  namespace: practica-s10
  labels:
    app: backend-webflux
    tier: backend
spec:
  type: NodePort
  selector:
    app: backend-webflux
    tier: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http-webflux
