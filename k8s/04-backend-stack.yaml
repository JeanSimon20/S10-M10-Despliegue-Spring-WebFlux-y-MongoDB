# ==============================================================================
# S10 | M10: MANIFIESTO 04 - STACK DEL BACKEND REACTIVO (SPRING WEBFLUX)
# ==============================================================================
# Incluye:
#   1. Deployment del microservicio Spring WebFlux (2 réplicas para Alta Disponibilidad).
#   2. Inyección masiva de variables de entorno con envFrom (ConfigMap + Secret).
#   3. Sondas de salud (Liveness y Readiness Probes) vía Spring Boot Actuator.
#   4. Service tipo NodePort (puerto externo 30080) para pruebas desde el navegador/Postman.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-webflux-deployment
  namespace: practica-s10
  labels:
    app: backend-webflux
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-webflux
      tier: backend
  template:
    metadata:
      labels:
        app: backend-webflux
        tier: backend
    spec:
      containers:
        - name: spring-webflux-api
          image: vallegrande/webflux-mongo-k8s:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http-netty
          # Inyección desacoplada de toda la configuración pública y credenciales
          envFrom:
            - configMapRef:
                name: app-configmap
            - secretRef:
                name: db-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Readiness Probe: Kubernetes solo envía tráfico cuando Netty y MongoDB están listos
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness Probe: Kubernetes reinicia el contenedor si la JVM entra en bloqueo o fallo crítico
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
# ==============================================================================
# SERVICE EXTERNO: NodePort (Exposición del API Reactivo hacia el Host/Cliente)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: backend-webflux-service
  namespace: practica-s10
  labels:
    app: backend-webflux
    tier: backend
spec:
  type: NodePort
  selector:
    app: backend-webflux
    tier: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      # Puerto fijo (rango oficial K8s: 30000-32767) para demostración en vivo
      nodePort: 30080
      name: http-webflux

