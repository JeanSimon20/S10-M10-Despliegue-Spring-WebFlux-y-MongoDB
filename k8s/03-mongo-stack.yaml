apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
  namespace: practica-s10
  labels:
    app: mongo-db
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-db
      tier: database
  template:
    metadata:
      labels:
        app: mongo-db
        tier: database
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
              name: mongo-port
          envFrom:
            - secretRef:
                name: db-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
      volumes:
        - name: mongo-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: practica-s10
  labels:
    app: mongo-db
    tier: database
spec:
  type: ClusterIP
  selector:
    app: mongo-db
    tier: database
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
      name: tcp-mongo
