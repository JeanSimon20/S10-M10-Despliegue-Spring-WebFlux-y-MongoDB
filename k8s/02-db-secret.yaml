# Valores codificados en Base64:
#   echo -n 'admin' | base64       -> YWRtaW4=
#   echo -n 'secret123' | base64   -> c2VjcmV0MTIz
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: practica-s10
  labels:
    app: webflux-mongo-stack
    component: security
    tier: database
type: Opaque
data:
  MONGO_INITDB_ROOT_USERNAME: YWRtaW4=
  MONGO_INITDB_ROOT_PASSWORD: c2VjcmV0MTIz
