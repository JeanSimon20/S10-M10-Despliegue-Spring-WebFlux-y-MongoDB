# ==============================================================================
# S10 | M10: MANIFIESTO 02 - SECRET DE CREDENCIALES DE BASE DE DATOS
# ==============================================================================
# Propósito: Almacenar credenciales sensibles separadas del código fuente
# y de los ConfigMaps públicos.
#
# Cómo se generaron estos valores en terminal (Linux/macOS/Git Bash):
#   echo -n 'admin' | base64       -->  YWRtaW4=
#   echo -n 'secret123' | base64   -->  c2VjcmV0MTIz
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: practica-s10
  labels:
    app: webflux-mongo-stack
    component: security
    tier: database
type: Opaque
data:
  # Usuario administrador de MongoDB ('admin' en Base64)
  MONGO_INITDB_ROOT_USERNAME: YWRtaW4=
  # Contraseña del administrador de MongoDB ('secret123' en Base64)
  MONGO_INITDB_ROOT_PASSWORD: c2VjcmV0MTIz

